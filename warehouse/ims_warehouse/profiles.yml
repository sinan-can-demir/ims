# Committed so dbt works out of the box for any contributor and in CI —
# previously this only existed as an untracked ~/.dbt/profiles.yml on one
# dev's machine, so nobody else (including CI) could run `make dbt-run`.
# No secrets here: duckdb has no credentials, just a local file path.
# `--profiles-dir .` (see Makefile) is what makes dbt look here instead of
# the ~/.dbt/ default.
ims_warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      # WAREHOUSE_DB_PATH, deliberately NOT WAREHOUSE_ROOT — the catalog
      # file always stays local (see app/config.py's comment on
      # WAREHOUSE_DB_PATH), even when WAREHOUSE_ROOT itself is an s3://
      # URI for the *source*/mart parquet (models/sources.yml,
      # dim_products.sql, dim_dates.sql all read from it independently of
      # where this catalog file lives). There's no supported way to run a
      # writable DuckDB database directly on S3, so this path can't ever
      # be derived from a value that might be S3.
      #
      # Relative to the cwd dbt runs from (warehouse/ims_warehouse/), so
      # this resolves to warehouse/ims.duckdb with no env var needed —
      # same physical file app/services/feature_service.py opens.
      path: "{{ env_var('WAREHOUSE_DB_PATH', '../ims.duckdb') }}"
      threads: 4
      # httpfs is harmless to load unconditionally — local-only runs never
      # touch it. Every setting below is blank/DuckDB's own default when
      # unset, so local mode (no S3/MinIO configured) is unaffected; see
      # app/core/storage.py's configure_duckdb_s3() for the Python-side
      # equivalent these mirror.
      extensions:
        - httpfs
      settings:
        s3_region: "{{ env_var('AWS_REGION', '') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', '') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', '') }}"
        # DuckDB's s3_endpoint wants host[:port], not a full URL with
        # scheme — S3_ENDPOINT_URL is documented as a full URL (e.g.
        # http://minio:9000) to match app/core/storage.py, so strip it here.
        s3_endpoint: "{{ env_var('S3_ENDPOINT_URL', '')|replace('http://', '')|replace('https://', '') }}"
        s3_use_ssl: "{{ env_var('S3_ENDPOINT_URL', '').startswith('https') }}"
        s3_url_style: "{{ env_var('S3_URL_STYLE', 'vhost') }}"
