version: 2

sources:
  - name: data_lake
    schema: main
    meta:
      # Default is relative to the cwd dbt runs from (warehouse/ims_warehouse/,
      # per the Makefile's `cd warehouse/ims_warehouse && dbt ...`), so this
      # works out of the box on a fresh clone with no env var needed.
      # union_by_name=true (#210) — matches app/services/warehouse_service.py's
      # own events glob: without it, a file from before a schema change (e.g.
      # organization_id, added in Epoch 10 PR 13, #149) sitting next to
      # newer-schema files makes this glob throw instead of unioning by
      # column name (missing columns read as NULL for that file's rows).
      external_location: "read_parquet('{{ env_var(\"DATA_LAKE_ROOT\", \"../../data_lake\") }}/inventory_events/**/*.parquet', union_by_name=true)"
    tables:
      - name: inventory_events
        description: "Append-only inventory event log — source of truth for all stock changes"
        columns:
          - name: event_id
            description: "Unique identifier for idempotency"
          - name: product_id
            description: "Foreign key to products"
          - name: event_type
            description: "PURCHASE, SALE, DAMAGE, ADJUSTMENT, or RETURN"
          - name: quantity
            description: "Normalized quantity delta — negative for SALE and DAMAGE"
          - name: created_at
            description: "Timestamp of when the event was recorded"
          - name: organization_id
            description: >
              Owning org (Epoch 10 PR 13, #149) — a real column in the
              underlying Parquet files, not just an org_id= partition-path
              segment. The source's own read_parquet() glob (**/*.parquet)
              already recurses through that extra directory level with no
              change needed here.