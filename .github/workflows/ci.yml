name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ims_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ims_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Runs the full suite including @pytest.mark.postgres tests (e.g. the
      # SELECT FOR UPDATE oversell-protection test) against a real Postgres —
      # that path is a silent no-op under SQLite, so this is the only place
      # it's actually exercised.
      - run: make test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build -f docker/Dockerfile .

  # Exercises the export -> warehouse -> dbt pipeline end-to-end against a
  # real Postgres with real (seeded) data, catching regressions that
  # lint/test/docker-build can't — e.g. a broken dbt model or schema test
  # only ever surfaces here, never in the API test suite. Matrixed over
  # local disk and S3 (MinIO) storage backends — the S3 code path
  # (app/core/storage.py's fsspec/s3fs wrapping, warehouse's DuckDB httpfs
  # wiring) shipped in #22 with only manual verification; this closes that
  # regression-coverage gap (#130).
  pipeline:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        storage_backend: [local, s3]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ims_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ims_pipeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ims_pipeline

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # A `services:` container can't be given a command, and the official
      # minio/minio image (same one docker-compose.minio.yml/
      # docker-compose.prod.yml already use) has no working default one —
      # started directly as a step instead, same image/command as those
      # compose files.
      - name: Start MinIO
        if: matrix.storage_backend == 's3'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci_minio_user \
            -e MINIO_ROOT_PASSWORD=ci_minio_password \
            minio/minio:latest server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy in time" >&2
          exit 1

      - name: Create S3 test bucket and point pipeline storage roots at it
        if: matrix.storage_backend == 's3'
        run: |
          AWS_ACCESS_KEY_ID=ci_minio_user AWS_SECRET_ACCESS_KEY=ci_minio_password \
            aws --endpoint-url http://localhost:9000 --region us-east-1 s3 mb s3://ims-ci-test
          {
            echo "DATA_LAKE_ROOT=s3://ims-ci-test/data_lake"
            echo "WAREHOUSE_ROOT=s3://ims-ci-test/warehouse"
            echo "FEATURE_STORE_PATH=s3://ims-ci-test/feature_store"
            echo "MODELS_DIR=s3://ims-ci-test/models"
            echo "S3_ENDPOINT_URL=http://localhost:9000"
            echo "S3_URL_STYLE=path"
            echo "AWS_ACCESS_KEY_ID=ci_minio_user"
            echo "AWS_SECRET_ACCESS_KEY=ci_minio_password"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed demo data
        run: python scripts/seed_data.py

      - name: Export events to data lake
        run: make export

      - name: Build warehouse dimension/fact tables
        run: make warehouse

      - name: dbt run
        run: make dbt-run

      - name: dbt test
        run: make dbt-test

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

      # --provenance=false --sbom=false: forces a single-manifest image
      # instead of buildx's default manifest-list (real manifest + a
      # separate attestation/SBOM manifest) under the same tag. Kept for
      # build hygiene even though it turned out NOT to be the cause of the
      # stale-finding mismatch below (confirmed on a second CI run with
      # this flag already in place — same phantom finding, unchanged).
      - name: Build image for scanning
        run: docker build -f docker/Dockerfile --provenance=false --sbom=false -t ims-api:scan .

      # TEMPORARY debug step — investigating a reproducible-on-CI,
      # not-reproducible-locally mismatch: the compact trivy-action table
      # output reports msgpack 1.1.2 / setuptools 70.3.0 as installed
      # (both HIGH, both supposedly fixed upstream by requirements.txt/
      # Dockerfile changes) under a "Python (python-pkg)" aggregate
      # heading with no associated file path, while every individual
      # per-file dist-info entry in the same report's summary table shows
      # the correct fixed versions (msgpack-1.2.1, setuptools-83.0.0) at 0
      # findings. Dumping JSON output here to get the exact PkgPath/Layer
      # this aggregate finding actually points at. Remove once diagnosed.
      - name: Debug - install trivy CLI directly (docker.io image pull was denied)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: true

      - name: Debug - dump full trivy JSON findings
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --pkg-types os,library --format json ims-api:scan > /tmp/trivy-debug.json
          jq '[.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[]? | select(.PkgName == "msgpack" or .PkgName == "setuptools")] | .[:10]' /tmp/trivy-debug.json
          echo "--- all Target/Class/Type entries with any Vulnerabilities ---"
          jq '[.Results[]? | select(.Vulnerabilities) | {Target, Class, Type, VulnCount: (.Vulnerabilities | length)}]' /tmp/trivy-debug.json

      # HIGH/CRITICAL only, matching the severity trivy-action defaults to
      # failing CI on elsewhere — keeps this from blocking on low-severity
      # findings that have no fix available yet.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ims-api:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Deploys to AWS on every push to main, once lint/test/docker-build are all
  # green. Uses GitHub OIDC to assume an AWS IAM role — no long-lived AWS
  # keys are stored in this repo. The role, ECS cluster/service, and ECR
  # repo are provisioned separately via Terraform (see infra/README.md);
  # this job only builds+pushes an image and points the ECS service at it.
  # Opt-in: skipped entirely until AWS_DEPLOY_ROLE_ARN is set (i.e. until
  # someone runs the Terraform bootstrap), rather than failing CI.
  deploy:
    needs: [lint, test, docker-build, scan, pipeline]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/ims-api:sha-${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # Migrations run as a one-off task, registered and run against the new
      # image, and must succeed before the api service is ever updated to
      # that image — replaces the old inline `alembic upgrade head &&` that
      # used to race across concurrent task starts (see
      # infra/ecs.tf's aws_ecs_task_definition.migrate).
      - name: Fetch current migrate task definition
        run: |
          aws ecs describe-task-definition --task-definition ims-migrate \
            --query taskDefinition > migrate-task-def.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render-migrate
        with:
          task-definition: migrate-task-def.json
          container-name: migrate
          image: ${{ steps.ecr-login.outputs.registry }}/ims-api:sha-${{ github.sha }}

      - name: Register migrate task definition revision
        id: register-migrate
        run: |
          CLEANED=$(jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "${{ steps.render-migrate.outputs.task-definition }}")
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$CLEANED" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Run migration task and wait for completion
        run: |
          NETCFG=$(aws ecs describe-services --cluster ims-cluster --services ims-api-service \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NETCFG" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NETCFG" | jq -r '.securityGroups | join(",")')

          TASK_ARN=$(aws ecs run-task \
            --cluster ims-cluster \
            --task-definition "${{ steps.register-migrate.outputs.task_def_arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster ims-cluster --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster ims-cluster --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed — aborting before the api service is updated."
            exit 1
          fi

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition ims-api \
            --query taskDefinition > task-def.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.ecr-login.outputs.registry }}/ims-api:sha-${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ims-api-service
          cluster: ims-cluster
          wait-for-service-stability: true
