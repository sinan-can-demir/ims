services:

  db:
    # Digest-pinned (#285), same reasoning as docker/Dockerfile's
    # PYTHON_BASE_IMAGE: a floating tag can silently resolve to different
    # bits over time, and CI only scans what's pinned here (see
    # .github/workflows/ci.yml's `scan` job) -- re-pin both together when a
    # CVE lands, same as the API base image already does.
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ims"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations then exits. `api` waits for this to
  # succeed before starting, instead of racing its own inline `alembic
  # upgrade head` against other workers/replicas at boot.
  migrate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ims
    command: alembic -c config/alembic.ini upgrade head

  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    # This quickstart file deliberately does not load .env (no `env_file:`),
    # so JWT_SECRET etc. fall back to the documented dev-only default — see
    # SECURITY.md. docker-compose.prod.yml does load .env, for real deploys.
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ims
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    volumes:
      - .:/app:z
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ims
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    # Overrides the image's baked-in HEALTHCHECK (docker/Dockerfile), which
    # always curls :8000/health — correct for `api`, but this service is
    # Streamlit on :8501 with its own health endpoint.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: