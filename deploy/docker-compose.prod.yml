# Production hardening for a self-hosted deploy. Apply on top of the base
# compose file:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --project-directory . up -d
#
# See docs/deployment/self-hosted.md for the full walkthrough. Requires a
# .env file (copy .env.example) with, at minimum, POSTGRES_PASSWORD set
# (fails loudly at startup if unset) and JWT_SECRET set (falls back to a
# fixed, publicly-known dev secret if unset, rather than failing — see
# SECURITY.md).

services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ims}
    # `!override` replaces the base file's list instead of merging into it —
    # plain `ports: []` would NOT remove the base's published port under
    # Compose's default list-merge behavior.
    ports: !override [] # never expose Postgres directly to the internet

  migrate:
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ims}
    command: alembic -c config/alembic.ini upgrade head

  # S3-compatible object storage for the data pipeline — see #22 and
  # app/core/storage.py. Runs by default in prod (self-hosted's zero-cost
  # S3-compatible backend), independent of whether DATA_LAKE_ROOT etc. are
  # actually pointed at it yet — local disk (this file's default) works
  # fine with MinIO just sitting idle. Never published to the host, same
  # as `db` above — only reachable from other containers on the internal
  # Docker network.
  minio:
    image: minio/minio:latest
    container_name: ims_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    # `!override` replaces the base file's `.:/app:Z` dev source bind-mount
    # (running the built image as-is) with just the 4 pipeline directories —
    # local-fallback mode (no S3/MinIO configured) previously had nowhere
    # durable to write in prod, so `data_lake`/`warehouse`/`feature_store`/
    # `models` were silently lost on every container recreate. Shared with
    # `dashboard` below (same volumes, same mount paths) since both read the
    # same underlying pipeline output, not independent copies.
    volumes: !override
      - data_lake_data:/app/data_lake
      - warehouse_data:/app/warehouse
      - feature_store_data:/app/feature_store
      - models_data:/app/models
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ims}
      # Required so /metrics can merge counters across Gunicorn's worker
      # processes — see config/gunicorn.conf.py and app/core/metrics.py.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      # MinIO wiring — only actually used once DATA_LAKE_ROOT etc. (in .env)
      # are pointed at s3:// URIs; harmless no-op while they stay local.
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_URL_STYLE: path
    # Gunicorn + UvicornWorker instead of the base file's single-worker dev
    # command — real concurrency for production traffic. WEB_CONCURRENCY
    # defaults to 4, tuned for the "1-2 vCPU / 2-4GB RAM" box the deployment
    # guide recommends; override it in .env for a bigger/smaller server
    # (rule of thumb: 2x vCPU cores + 1). Migrations no longer run inline
    # here — the base file's `migrate` service (overridden above with prod
    # credentials) runs once and `api` waits for it via depends_on.
    command: >
      gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-4} --config config/gunicorn.conf.py

  dashboard:
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    volumes: !override
      - data_lake_data:/app/data_lake
      - warehouse_data:/app/warehouse
      - feature_store_data:/app/feature_store
      - models_data:/app/models
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ims}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_URL_STYLE: path
    # Unlike `api`, the dashboard has no app-level auth (no bearer-token
    # equivalent) — Caddy's basic_auth is its only protection. So, unlike
    # api's port staying published here, the dashboard's port is hidden by
    # default in this file already: it only becomes reachable by adding
    # docker-compose.caddy.yml, which fronts it with basic_auth. Running
    # prod.yml without the Caddy overlay leaves the dashboard unreachable,
    # not unauthenticated.
    ports: !override []

volumes:
  data_lake_data:
  warehouse_data:
  feature_store_data:
  models_data:
  minio_data:
